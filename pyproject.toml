[project]
name = "rss-intel-pipeline"
version = "3.1.0"
description = "RSS-based cyber-security & geopolitics intelligence pipeline"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, B: bugbear, UP: pyupgrade,
# SIM: flake8-simplify, C4: comprehensions
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
